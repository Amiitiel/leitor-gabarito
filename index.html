<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Leitor de Gabarito</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f4f2;--fg:#1a1a1a;--card:#fff;--mut:#666;--warn:#d97706}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111;--fg:#f2f2f2;--card:#1d1d1d;--mut:#aaa}}
:root[data-theme="dark"]{--bg:#111;--fg:#f2f2f2;--card:#1d1d1d;--mut:#aaa}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:640px;margin:0 auto;padding:12px}
#box{position:relative;aspect-ratio:3/4;background:#000;border-radius:12px;overflow:hidden}
#vid,#ov{position:absolute;inset:0;width:100%;height:100%}
#vid{object-fit:cover}
#out{width:100%;height:auto;display:block;border-radius:12px}
#st{margin:10px 0;padding:10px 12px;border-radius:10px;background:var(--card);font-size:15px}
details{background:var(--card);border-radius:10px;padding:10px 12px;margin:8px 0}
summary{cursor:pointer;font-size:15px}
.cfg{display:grid;gap:10px;margin-top:10px;font-size:14px}
.cfg input,.cfg select{font:inherit;padding:6px;border-radius:8px;border:1px solid var(--mut);background:var(--bg);color:var(--fg)}
.cfg input{width:100%;letter-spacing:2px;text-transform:uppercase}
#grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.row{display:flex;gap:8px;margin:8px 0}
button,label.b{flex:1;padding:12px;border:0;border-radius:10px;background:var(--fg);color:var(--bg);font-size:15px;text-align:center;cursor:pointer}
#res{display:none}
.score{display:flex;justify-content:space-around;background:var(--card);border-radius:12px;padding:14px;margin:10px 0;text-align:center}
.score b{font-size:34px;display:block}.score span{color:var(--mut);font-size:13px}
#list{background:var(--card);border-radius:12px;padding:10px 14px;font-size:14px;line-height:1.6}
.k{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px}
</style></head><body><main>
<div id="cam">
 <div id="box"><video id="vid" playsinline muted autoplay></video><canvas id="ov" width="480" height="640"></canvas></div>
 <div id="st">Iniciando câmera…</div>
 <details><summary>Questões e gabarito</summary><div class="cfg">
  <label>Nº de questões <select id="n"></select></label>
  <label>Gabarito em texto (ex.: CACDB…) <input id="txt" autocomplete="off" spellcheck="false"></label>
  <div id="grid"></div></div></details>
 <div class="row"><label class="b">Enviar foto<input id="file" type="file" accept="image/*" capture="environment" hidden></label></div>
</div>
<div id="res">
 <canvas id="out"></canvas>
 <div class="score"><div><b id="ac">–</b><span>acertos</span></div><div><b id="nt">–</b><span>nota</span></div></div>
 <div id="list"></div>
 <div class="row"><button id="again">Nova leitura</button></div>
</div>
</main>
<script>
const $=id=>document.getElementById(id),vid=$("vid"),ov=$("ov"),octx=ov.getContext("2d"),box=$("box");
const dw=320;let dh=240;const dc=document.createElement("canvas"),dctx=dc.getContext("2d",{willReadFrequently:true});
let N=20,KEY="CACDBABCCACBDBCDBDAC".split(""),running=false,stable=0,prev=null;
try{const s=JSON.parse(localStorage.getItem("gab")||"null");
 if(s&&Array.isArray(s.key)&&s.key.length===20&&s.key.every(l=>"ABCDE".includes(l))&&s.n>=1&&s.n<=20){KEY=s.key;N=s.n}}catch(e){}
const save=()=>{try{localStorage.setItem("gab",JSON.stringify({n:N,key:KEY}))}catch(e){}};
const K=()=>KEY.slice(0,N);

// ---------- configuração ----------
const nsel=$("n");for(let i=1;i<=20;i++)nsel.add(new Option(i,i));
function sync(){nsel.value=N;$("txt").value=K().join("");const g=$("grid");g.innerHTML="";
 for(let i=0;i<N;i++){const d=document.createElement("label");d.textContent=String(i+1).padStart(2,"0")+" ";
  const s=document.createElement("select");"ABCDE".split("").forEach(l=>s.add(new Option(l,l)));s.value=KEY[i];
  s.onchange=()=>{KEY[i]=s.value;$("txt").value=K().join("");save()};d.appendChild(s);g.appendChild(d)}}
nsel.onchange=()=>{N=+nsel.value;save();sync()};
$("txt").onchange=e=>{const L=e.target.value.toUpperCase().replace(/[^A-E]/g,"");if(L){N=Math.min(20,L.length);for(let i=0;i<N;i++)KEY[i]=L[i];save()}sync()};
sync();

// ---------- detecção dos 4 quadrados ----------
function otsu(g){const h=new Uint32Array(256);for(let i=0;i<g.length;i++)h[g[i]]++;const n=g.length;let s=0;for(let i=0;i<256;i++)s+=i*h[i];
 let sb=0,wb=0,best=0,t=100;for(let i=0;i<256;i++){wb+=h[i];if(!wb)continue;const wf=n-wb;if(!wf)break;sb+=i*h[i];
 const mb=sb/wb,mf=(s-sb)/wf,v=wb*wf*(mb-mf)**2;if(v>best){best=v;t=i}}return Math.min(t,110)}
function findCorners(d,w,h){
 const g=new Uint8Array(w*h);for(let i=0;i<w*h;i++)g[i]=(d[i*4]*3+d[i*4+1]*6+d[i*4+2])/10;
 const t=otsu(g),seen=new Uint8Array(w*h),st=new Int32Array(w*h),pts=[];
 for(let i=0;i<w*h;i++){if(seen[i]||g[i]>=t)continue;
  let sp=0,x0=w,x1=0,y0=h,y1=0,c=0;st[sp++]=i;seen[i]=1;
  while(sp){const p=st[--sp],x=p%w,y=(p/w)|0;c++;if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y;
   if(x>0&&!seen[p-1]&&g[p-1]<t){seen[p-1]=1;st[sp++]=p-1}
   if(x<w-1&&!seen[p+1]&&g[p+1]<t){seen[p+1]=1;st[sp++]=p+1}
   if(y>0&&!seen[p-w]&&g[p-w]<t){seen[p-w]=1;st[sp++]=p-w}
   if(y<h-1&&!seen[p+w]&&g[p+w]<t){seen[p+w]=1;st[sp++]=p+w}}
  const bw=x1-x0+1,bh=y1-y0+1;
  if(bw>w*.008&&bw<w*.09&&bh>w*.008&&bh<w*.09&&bw/bh>.7&&bw/bh<1.4&&c/(bw*bh)>.85)pts.push({x:(x0+x1)/2,y:(y0+y1)/2});}
 if(pts.length<4)return null;
 const pick=f=>pts.reduce((a,b)=>f(b)>f(a)?b:a);
 const TL=pick(p=>-(p.x+p.y)),BR=pick(p=>p.x+p.y),TR=pick(p=>p.x-p.y),BL=pick(p=>p.y-p.x);
 const q=[TL,TR,BR,BL];if(new Set(q).size<4)return null;
 const W=Math.hypot(TR.x-TL.x,TR.y-TL.y),H=Math.hypot(BL.x-TL.x,BL.y-TL.y);
 if(W<w*.3||H<w*.3||W/H<.7||W/H>1.5)return null;
 return q;
}
// ---------- leitura das bolhas ----------
function map(q,u,v){const[TL,TR,BR,BL]=q;
 return{x:(1-u)*(1-v)*TL.x+u*(1-v)*TR.x+u*v*BR.x+(1-u)*v*BL.x,y:(1-u)*(1-v)*TL.y+u*(1-v)*TR.y+u*v*BR.y+(1-u)*v*BL.y}}
function bub(q,i,k){const col=i<10?0:1,r=i%10;return map(q,col?.625+.077*k:.13+.0695*k,.13+.0905*r)}
function lumAt(img,cx,cy,r){let s=0,n=0;for(let y=-r;y<=r;y+=2)for(let x=-r;x<=r;x+=2){if(x*x+y*y>r*r)continue;
 const px=Math.round(cx+x),py=Math.round(cy+y);if(px<0||py<0||px>=img.width||py>=img.height)continue;
 const o=(py*img.width+px)*4;s+=(img.data[o]*3+img.data[o+1]*6+img.data[o+2])/10;n++}return n?s/n:255}
function analyze(ctx,q,W,H){
 const img=ctx.getImageData(0,0,W,H),side=Math.hypot(q[1].x-q[0].x,q[1].y-q[0].y),sr=Math.max(3,side*.012);
 return K().map((key,i)=>{
  const L=[0,1,2,3,4].map(k=>{const p=bub(q,i,k);return lumAt(img,p.x,p.y,sr)});
  const med=[...L].sort((a,b)=>a-b)[2],m=L.map((v,k)=>v<med-45?k:-1).filter(k=>k>=0);
  const kk="ABCDE".indexOf(key);
  if(!m.length)return{st:"blank",key:kk};
  if(m.length>1)return{st:"double",key:kk,m};
  return{st:m[0]===kk?"ok":"bad",key:kk,m:[m[0]]}});
}
function draw(ctx,q,res){
 const side=Math.hypot(q[1].x-q[0].x,q[1].y-q[0].y),R=side*.027,lw=Math.max(3,side*.007);
 const ring=(p,c,dash)=>{ctx.beginPath();ctx.arc(p.x,p.y,R,0,7);ctx.strokeStyle=c;ctx.lineWidth=lw;ctx.setLineDash(dash?[lw*1.5,lw*1.2]:[]);ctx.stroke();ctx.setLineDash([])};
 res.forEach((r,i)=>{const kp=bub(q,i,r.key);
  if(r.st==="ok")ring(kp,"#16a34a");
  else if(r.st==="bad"){ring(bub(q,i,r.m[0]),"#dc2626");ring(kp,"#16a34a",1)}
  else{ring(kp,"#d97706",1);if(r.m)r.m.forEach(k=>ring(bub(q,i,k),"#d97706"))}});
}
// ---------- resultado ----------
function stopCam(){running=false;if(vid.srcObject)vid.srcObject.getTracks().forEach(t=>t.stop());vid.srcObject=null}
function show(src,q,W,H){
 const out=$("out");out.width=W;out.height=H;const c=out.getContext("2d",{willReadFrequently:true});c.drawImage(src,0,0,W,H);
 const res=analyze(c,q,W,H);draw(c,q,res);
 const ok=res.filter(r=>r.st==="ok").length,nota=ok*10/N;
 $("ac").textContent=ok+"/"+N;$("nt").textContent=nota.toFixed(1).replace(".",",");
 const lab=r=>"ABCDE"[r];let h='<div><span class="k" style="background:#16a34a"></span>certa &nbsp;<span class="k" style="background:#dc2626"></span>errada &nbsp;<span class="k" style="background:#d97706"></span>revisar</div>';
 const bad=res.map((r,i)=>({r,i})).filter(o=>o.r.st!=="ok");
 h+=bad.length?bad.map(({r,i})=>{const n=String(i+1).padStart(2,"0");
  return r.st==="bad"?`<div>Q${n}: marcou ${lab(r.m[0])}, certa ${lab(r.key)}</div>`
  :r.st==="blank"?`<div style="color:var(--warn)">Q${n}: em branco ou marca fraca (certa ${lab(r.key)}) — revisar</div>`
  :`<div style="color:var(--warn)">Q${n}: dupla marcação (${r.m.map(lab).join("+")}) — revisar</div>`}).join(""):"<div>Todas corretas.</div>";
 $("list").innerHTML=h;$("cam").style.display="none";$("res").style.display="block";stopCam();
}
// ---------- câmera ao vivo ----------
function guide(w,h){let gw=w*.78,gh=gw/1.03;if(gh>h*.88){gh=h*.88;gw=gh*1.03}
 const x=(w-gw)/2,y=(h-gh)/2;return[{x,y},{x:x+gw,y},{x:x+gw,y:y+gh},{x,y:y+gh}]}
function sq(P,s,c,fill){octx.strokeStyle=c;octx.fillStyle=c;octx.lineWidth=1.6;
 P.forEach(p=>{if(fill){octx.globalAlpha=.45;octx.fillRect(p.x-s/2,p.y-s/2,s,s);octx.globalAlpha=1}octx.strokeRect(p.x-s/2,p.y-s/2,s,s)})}
async function start(){
 $("res").style.display="none";$("cam").style.display="block";stable=0;prev=null;
 try{vid.srcObject=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"},width:{ideal:1920},height:{ideal:1080}},audio:false});
  await vid.play();const vw=vid.videoWidth,vh=vid.videoHeight;
  box.style.aspectRatio=vw+"/"+vh;dh=Math.round(dw*vh/vw);dc.width=dw;dc.height=dh;ov.width=640;ov.height=Math.round(640*vh/vw);
  running=true;$("st").textContent="Encaixe os 4 quadrados pretos do cartão nos cantos do guia.";tick();
 }catch(e){$("st").textContent="Câmera bloqueada ou indisponível ("+(e&&e.name||"erro")+"). Toque em “Enviar foto” para fotografar o cartão."}
}
function tick(){
 if(!running)return;const t0=performance.now();
 dctx.drawImage(vid,0,0,dw,dh);const q=findCorners(dctx.getImageData(0,0,dw,dh).data,dw,dh),G=guide(dw,dh);
 const f=ov.width/dw;octx.setTransform(f,0,0,f,0,0);octx.clearRect(0,0,dw,dh);
 const near=q&&q.every((p,i)=>Math.hypot(p.x-G[i].x,p.y-G[i].y)<dw*.12);
 sq(G,Math.hypot(G[1].x-G[0].x,G[1].y-G[0].y)*.047,near?"#16a34a":"#ffffff",false);
 if(q){const side=Math.hypot(q[1].x-q[0].x,q[1].y-q[0].y),sz=side/dw;sq(q,side*.047,"#16a34a",true);
  const moved=prev?Math.max(...q.map((p,i)=>Math.hypot(p.x-prev[i].x,p.y-prev[i].y))):99;
  stable=moved<dw*.02&&sz>.45?stable+1:0;prev=q;
  $("st").textContent=sz>.45?"Quadrados detectados. Segure firme… "+Math.min(stable,4)+"/4":"Aproxime o cartão até os quadrados coincidirem com o guia.";
  if(stable>=4){capture(q);return}
 }else{stable=0;prev=null;$("st").textContent="Encaixe os 4 quadrados pretos do cartão nos cantos do guia."}
 setTimeout(tick,Math.max(0,110-(performance.now()-t0)));
}
function capture(q){
 running=false;const W=vid.videoWidth,H=vid.videoHeight,cv=document.createElement("canvas");cv.width=W;cv.height=H;cv.getContext("2d").drawImage(vid,0,0);
 const rw=960,rh=Math.round(960*H/W),rc=document.createElement("canvas");rc.width=rw;rc.height=rh;
 const rx=rc.getContext("2d",{willReadFrequently:true});rx.drawImage(cv,0,0,rw,rh);
 const r=findCorners(rx.getImageData(0,0,rw,rh).data,rw,rh);
 show(cv,r?r.map(p=>({x:p.x*W/rw,y:p.y*H/rh})):q.map(p=>({x:p.x*W/dw,y:p.y*H/dh})),W,H);
}
// ---------- foto enviada ----------
$("file").onchange=e=>{const f=e.target.files[0];if(!f)return;const im=new Image();
 im.onload=()=>{const s=Math.min(1,1800/Math.max(im.width,im.height)),W=Math.round(im.width*s),H=Math.round(im.height*s);
  const cv=document.createElement("canvas");cv.width=W;cv.height=H;cv.getContext("2d").drawImage(im,0,0,W,H);
  const sw=960,sh=Math.round(960*H/W),sc=document.createElement("canvas");sc.width=sw;sc.height=sh;const sx=sc.getContext("2d",{willReadFrequently:true});sx.drawImage(im,0,0,sw,sh);
  const q=findCorners(sx.getImageData(0,0,sw,sh).data,sw,sh);
  if(!q){$("st").textContent="Não achei os 4 quadrados nessa foto. Enquadre o cartão inteiro e tente de novo.";return}
  stopCam();show(cv,q.map(p=>({x:p.x*W/sw,y:p.y*H/sh})),W,H)};
 im.src=URL.createObjectURL(f);e.target.value=""};
$("again").onclick=start;
start();
</script></body></html>
